name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt

    - name: Cargo Format Check
      run: cargo fmt --all --check

  clippy:
    name: Clippy Lints
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - name: Clippy (spacecan)
      run: cargo clippy -p spacecan --all-targets -- -D warnings

    - name: Clippy (spacecan-virtual)
      run: cargo clippy -p spacecan-virtual --all-targets -- -D warnings

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Build Library
      run: cargo build -p spacecan

    - name: Build Virtual Binaries
      run: cargo build -p spacecan-virtual

    - name: Run Tests
      run: cargo test -p spacecan -p spacecan-virtual

  embedded-check:
    name: Embedded Feature Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Check spacecan with embedded feature
      run: cargo check -p spacecan --features embedded

  firmware-build:
    name: Firmware Cross-Compilation
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: thumbv6m-none-eabi

    - name: Build Firmware
      run: cargo build -p spacecan-firmware --target thumbv6m-none-eabi
