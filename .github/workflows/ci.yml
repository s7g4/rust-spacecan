name: Rust SpaceCAN CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  virtual_checks:
    name: SpaceCAN Virtual (Host) Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
      
      - name: Run Cargo Check
        run: cargo check -p spacecan -p spacecan-virtual
      
      - name: Run Clippy (Virtual & Lib)
        run: cargo clippy -p spacecan -p spacecan-virtual -- -D warnings
        
      - name: Run Test Suite
        run: cargo test -p spacecan -p spacecan-virtual

  firmware_checks:
    name: SpaceCAN Firmware (STM32F4) Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust Stable & Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      
      - name: Run Cargo Check (Firmware)
        run: cargo check -p spacecan-firmware --target thumbv7em-none-eabihf
        
      - name: Run Clippy (Firmware)
        run: cargo clippy -p spacecan-firmware --target thumbv7em-none-eabihf -- -D warnings
