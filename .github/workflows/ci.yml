name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  format-and-lint:
    name: Code Quality (Format & Clippy)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Cargo Format Check
      run: cargo fmt --all --check

    - name: Cargo Clippy Workspace
      run: cargo clippy --workspace --all-targets -- -D warnings

  host-build-and-test:
    name: Host Verification (Linux & Windows)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cargo Check Workspace
      run: cargo check --workspace

    - name: Cargo Test Workspace
      run: cargo test --workspace

    - name: Cargo Check Embedded Features
      run: cargo check --workspace --features embedded

  embedded-target-compilation:
    name: Bare-Metal Target Compilation
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: thumbv7em-none-eabihf

    - name: Build Bare-Metal Firmware Crate
      run: cargo build -p spacecan-firmware --target thumbv7em-none-eabihf
